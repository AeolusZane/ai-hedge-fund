version: "3.8"

services:
  # ── Main Application ──────────────────────────────────────────
  ai-hedge-fund:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PR_EMBEDDING_URL=http://pr-embedding:8100
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # Jira integration
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_TOKEN=${JIRA_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - pr-embedding
    restart: unless-stopped

  # ── PR Embedding Service (TF-IDF semantic search) ─────────────
  pr-embedding:
    build:
      context: ../pr-embedding
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - BITBUCKET_USER=${BITBUCKET_USER}
      - BITBUCKET_TOKEN=${BITBUCKET_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - DB_PATH=/app/data/pr_review.db
    volumes:
      - ../pr-embedding/data:/app/data
    restart: unless-stopped
